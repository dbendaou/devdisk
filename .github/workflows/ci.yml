name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Test (Ubuntu)
    runs-on: ubuntu-24.04
    container: swift:6.4.2
    steps:
      - uses: actions/checkout@v4
      # The swift image runs as root, which ignores chmod 000, so the
      # permission-error test needs an unprivileged user.
      - name: Create an unprivileged user
        run: |
          useradd --create-home builder
          chown -R builder "$GITHUB_WORKSPACE"
      - name: Build and test
        run: su builder -c "cd '$GITHUB_WORKSPACE' && swift test"

  app:
    name: Build app (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build ad-hoc signed DevDisk.app
        run: make app
      - name: Verify bundle and signature
        run: |
          test -x dist/DevDisk.app/Contents/MacOS/DevDisk
          test -f dist/DevDisk.app/Contents/Info.plist
          test -s dist/DevDisk.app/Contents/Resources/AppIcon.icns
          grep -q CFBundleIconFile dist/DevDisk.app/Contents/Info.plist
          codesign --verify --deep --strict dist/DevDisk.app
          codesign -dv dist/DevDisk.app
